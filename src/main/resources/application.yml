# Configurações do Servidor
server:
  port: 8080

# Configurações do H2 Database
spring:
  datasource:
    url: jdbc:h2:mem:produtosdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Cache com Redis
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutos em milissegundos
  
  # Configuração do Redis
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

# Logging
logging:
  level:
    com.ifood.produtos: DEBUG
    org.hibernate.SQL: DEBUG
